name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create package if needed
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Init Capacitor
        run: |
          npx cap init MellalChem com.mellalchem.app --web-dir .

      - name: Add Android
        run: |
          npx cap add android

      - name: Copy Web Assets
        run: |
          npx cap copy

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MellalChem-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
